<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rahul B — Data Analyst, Data Scientist, Data Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04050d"/><stop offset="1" stop-color="#0d1124"/></linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4facfe" stroke-opacity=".08"/></pattern>
<linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2400" y2="0"><stop offset="0" stop-color="#00f2fe"/><stop offset=".3" stop-color="#7f00ff"/><stop offset=".6" stop-color="#ff0844"/><stop offset="1" stop-color="#f9d423"/></linearGradient>
<linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#00f2fe"/><stop offset=".3" stop-color="#4facfe"/><stop offset=".55" stop-color="#ff0844"/><stop offset=".8" stop-color="#f9d423"/><stop offset="1" stop-color="#00f2fe"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="r0"><stop offset="0" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="1" stop-color="#00f2fe" stop-opacity="0"/></radialGradient><radialGradient id="r1"><stop offset="0" stop-color="#4facfe" stop-opacity=".8"/><stop offset="1" stop-color="#4facfe" stop-opacity="0"/></radialGradient><radialGradient id="r2"><stop offset="0" stop-color="#7f00ff" stop-opacity=".8"/><stop offset="1" stop-color="#7f00ff" stop-opacity="0"/></radialGradient><radialGradient id="r3"><stop offset="0" stop-color="#ff0844" stop-opacity=".8"/><stop offset="1" stop-color="#ff0844" stop-opacity="0"/></radialGradient><radialGradient id="r4"><stop offset="0" stop-color="#f9d423" stop-opacity=".8"/><stop offset="1" stop-color="#f9d423" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
</defs>
<style>
.b{transform-box:fill-box;transform-origin:center}
.s{fill:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
.w1{animation:wv1 14s linear infinite}
.w2{animation:wv2 9s linear infinite reverse}
@keyframes wv1{to{transform:translateX(-600px)}}
@keyframes wv2{to{transform:translateX(-400px)}}
.scan{animation:sc 6s linear infinite}
@keyframes sc{from{transform:translateY(-10px)}to{transform:translateY(320px)}}
.br{animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.t{font:900 104px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:10px}
.title{animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.g1,.g2{opacity:0}
.g1{fill:#00f2fe;animation:gl1 7s infinite}
.g2{fill:#ff0844;animation:gl2 7s infinite}
@keyframes gl1{0%,88%,100%{opacity:0;transform:translate(0,0)}89%{opacity:.85;transform:translate(-7px,-2px)}91%{opacity:.85;transform:translate(6px,3px)}93%{opacity:0}}
@keyframes gl2{0%,89%,100%{opacity:0;transform:translate(0,0)}90%{opacity:.8;transform:translate(7px,2px)}92%{opacity:.8;transform:translate(-5px,-3px)}94%{opacity:0}}
.sub{font:600 21px 'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;letter-spacing:5px;fill:#f9d423;animation:rise 1.4s .35s both}
.tag{font:400 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#c9d1d9;opacity:.85;animation:rise 1.4s .7s both}
.ft{font:900 54px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:6px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes d0{to{transform:translate(-119px,3px) scale(1.23)}}@keyframes d1{to{transform:translate(138px,25px) scale(1.15)}}@keyframes d2{to{transform:translate(-65px,13px) scale(1.35)}}@keyframes d3{to{transform:translate(61px,28px) scale(1.23)}}@keyframes d4{to{transform:translate(-119px,-5px) scale(1.21)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
