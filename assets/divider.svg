<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="presentation">
<defs>
<linearGradient id="f" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#00f2fe"/><stop offset=".25" stop-color="#4facfe"/><stop offset=".5" stop-color="#7f00ff"/><stop offset=".75" stop-color="#ff0844"/><stop offset="1" stop-color="#00f2fe"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="fade"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1200" height="28" fill="url(#fade)"/></mask>
<filter id="gl" x="-5%" y="-400%" width="110%" height="900%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
.run{animation:run 5s linear infinite}.r2{animation-delay:-2.5s}
@keyframes run{from{transform:translateX(-600px)}to{transform:translateX(600px)}}
.dia{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g mask="url(#m)">
<rect x="0" y="13" width="1200" height="2" fill="url(#f)" filter="url(#gl)"/>
<rect x="0" y="13" width="1200" height="2" rx="1" fill="url(#f)"/>
<circle class="run" cx="600" cy="14" r="3" fill="#fff"/>
<circle class="run r2" cx="600" cy="14" r="2" fill="#00f2fe"/>
</g>
<g class="dia"><rect x="591" y="5" width="18" height="18" transform="rotate(45 600 14)" fill="#0d1117" stroke="url(#f)" stroke-width="2"/><circle cx="600" cy="14" r="3" fill="#00f2fe"/></g>
</svg>